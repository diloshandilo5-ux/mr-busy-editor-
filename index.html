<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr_busy Video Editor</title>
<style>
  :root{--bg:#0f1117;--panel:#171a23;--line:#262b38;--text:#e8eaf0;--muted:#8b93a7;--accent:#f5a524}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:14px 16px;border-bottom:1px solid var(--line)}
  .logo{font-weight:700;font-size:20px}.logo span{color:var(--accent)}.logo small{color:var(--muted);font-weight:400;font-size:14px;margin-left:6px}
  main{max-width:640px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .pick{display:block;text-align:center;padding:36px 16px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);cursor:pointer}
  .pick:hover{border-color:var(--accent);color:var(--text)}
  .stage{position:relative;background:#000;border-radius:12px;overflow:hidden}
  video{width:100%;height:auto;display:block;max-height:60vh;background:#000}
  #ov{position:absolute;left:0;right:0;text-align:center;font-weight:700;text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none;padding:0 4%;line-height:1.1}
  #ov.top{top:4%}#ov.middle{top:50%;transform:translateY(-50%)}#ov.bottom{bottom:6%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .card h4{margin:0;font-size:15px}
  .row{display:flex;align-items:center;gap:10px}
  .row label{width:92px;flex:none;color:var(--muted);font-size:14px}
  .row input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
  .row span{width:54px;text-align:right;color:var(--muted);font-size:13px;flex:none}
  button,select,input[type=text]{font:inherit}
  button{cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 14px}
  button.main{background:var(--accent);color:#1a1200;border:0;font-weight:700;padding:13px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  select,input[type=text]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;flex:1;min-width:0}
  input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px}
  .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
  .note{font-size:13px;color:var(--muted)}
  canvas{display:none}
</style>
</head>
<body>
<header><div class="logo">Mr<span>_</span>busy <small>Video Editor</small></div></header>
<main>
  <label class="pick" id="pickBox"><input type="file" id="file" accept="video/*" hidden>📁 Video select pannunga<br><small>Un phone la irundhu mattum edit aagum. Video entha server kum pogaadhu.</small></label>

  <section id="ed" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="stage"><video id="vid" playsinline preload="auto"></video><div id="ov" class="bottom"></div></div>
    <div class="row"><button id="play">▶</button><input type="range" id="scrub" min="0" max="1000" value="0" style="flex:1;accent-color:#f5a524"><span id="tm" style="width:60px;text-align:right;color:#8b93a7;font-size:13px">0:00.0</span></div>

    <div class="card"><h4>✂️ Trim</h4>
      <div class="row"><label>Start</label><input type="range" id="ts" min="0" max="1" step="0.1" value="0"><span id="tsv">0:00.0</span></div>
      <div class="row"><label>End</label><input type="range" id="te" min="0" max="1" step="0.1" value="1"><span id="tev">0:00.0</span></div>
      <div class="row"><label>Speed</label><select id="sp"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select></div>
      <div class="row"><label>Mute</label><input type="checkbox" id="mu"></div>
    </div>

    <div class="card"><h4>🎨 Filters</h4>
      <div class="chips" id="presets">
        <button data-p="1,1,1">Normal</button><button data-p="1.05,1.15,1.5">Vivid</button><button data-p="1,1.1,0">B&amp;W</button><button data-p="0.92,1.2,0.85">Cinema</button><button data-p="1.2,1,1.1">Bright</button>
      </div>
      <div class="row"><label>Brightness</label><input type="range" id="rb" min="0.5" max="1.5" step="0.05" value="1"></div>
      <div class="row"><label>Contrast</label><input type="range" id="rc" min="0.5" max="1.5" step="0.05" value="1"></div>
      <div class="row"><label>Saturation</label><input type="range" id="rs" min="0" max="2" step="0.05" value="1"></div>
    </div>

    <div class="card"><h4>🔤 Text</h4>
      <div class="row"><input type="text" id="tx" placeholder="Text type pannunga..."><input type="color" id="tc" value="#ffffff"></div>
      <div class="row"><label>Size</label><input type="range" id="sz" min="3" max="20" step="0.5" value="8"></div>
      <div class="row"><label>Position</label><select id="tp"><option value="top">Top</option><option value="middle">Middle</option><option value="bottom" selected>Bottom</option></select></div>
    </div>

    <button class="main" id="exp">⬇️ Export video</button>
    <div class="bar" id="barw" hidden><i id="prog"></i></div>
    <div class="note" id="status">Export real-time la nadakkum: 1 nimisha video-ku ~1 nimisham aagum. Export aagum podhu screen on la, indha page open la vechirunga.</div>

    <div class="card" id="res" hidden><h4>✅ Ready</h4>
      <video id="out" controls playsinline style="width:100%;border-radius:10px;background:#000"></video>
      <button class="main" id="save">Save / Share</button>
    </div>
  </section>
  <canvas id="cv"></canvas>
</main>

<script>
const $ = (id) => document.getElementById(id);
const vid = $("vid");
const S = { start: 0, end: 0, speed: 1, b: 1, c: 1, s: 1, text: "", size: 8, color: "#ffffff", pos: "bottom", mute: false };
let dur = 0, exporting = false, outBlob = null, outUrl = null;
let actx = null, srcNode = null, prevGain = null, recGain = null, recDest = null;

const fmt = (t) => { const m = Math.floor(t / 60), s = (t % 60).toFixed(1); return m + ":" + (s < 10 ? "0" : "") + s; };
const cl = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);

$("file").onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  vid.src = URL.createObjectURL(f);
  vid.load();
};
vid.onloadedmetadata = () => {
  dur = vid.duration;
  S.start = 0; S.end = dur;
  $("ts").max = $("te").max = dur;
  $("ts").value = 0; $("te").value = dur;
  $("ed").hidden = false; $("ed").style.display = "flex";
  $("res").hidden = true;
  upd();
};

function upd() {
  $("tsv").textContent = fmt(S.start);
  $("tev").textContent = fmt(S.end);
  vid.style.filter = `brightness(${S.b}) contrast(${S.c}) saturate(${S.s})`;
  const o = $("ov");
  o.textContent = S.text;
  o.style.color = S.color;
  o.style.fontSize = (S.size / 100) * vid.clientHeight + "px";
  o.className = S.pos;
  if (prevGain && !exporting) prevGain.gain.value = S.mute ? 0 : 1;
}
window.addEventListener("resize", upd);

$("ts").oninput = () => { S.start = Math.min(+$("ts").value, S.end - 0.2); $("ts").value = S.start; vid.currentTime = S.start; upd(); };
$("te").oninput = () => { S.end = Math.max(+$("te").value, S.start + 0.2); $("te").value = S.end; vid.currentTime = S.end; upd(); };
$("sp").onchange = () => { S.speed = +$("sp").value; vid.playbackRate = S.speed; };
$("mu").onchange = () => { S.mute = $("mu").checked; upd(); };
const bind = (id, fn) => $(id).addEventListener("input", () => { fn($(id).value); upd(); });
bind("rb", (v) => (S.b = +v)); bind("rc", (v) => (S.c = +v)); bind("rs", (v) => (S.s = +v));
bind("tx", (v) => (S.text = v)); bind("tc", (v) => (S.color = v)); bind("sz", (v) => (S.size = +v));
$("tp").onchange = () => { S.pos = $("tp").value; upd(); };
document.querySelectorAll("#presets button").forEach((b) => (b.onclick = () => {
  const [x, y, z] = b.dataset.p.split(",").map(Number);
  S.b = x; S.c = y; S.s = z;
  $("rb").value = x; $("rc").value = y; $("rs").value = z;
  upd();
}));

function ensureAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    srcNode = actx.createMediaElementSource(vid);
    prevGain = actx.createGain();
    recGain = actx.createGain();
    recDest = actx.createMediaStreamDestination();
    srcNode.connect(prevGain); prevGain.connect(actx.destination);
    srcNode.connect(recGain); recGain.connect(recDest);
  } catch (e) { actx = null; }
}

$("play").onclick = async () => {
  if (exporting) return;
  ensureAudio();
  if (actx && actx.state !== "running") await actx.resume();
  if (vid.paused) {
    if (vid.currentTime < S.start || vid.currentTime >= S.end - 0.05) vid.currentTime = S.start;
    vid.playbackRate = S.speed;
    vid.play();
  } else vid.pause();
  upd();
};
vid.onplay = () => ($("play").textContent = "⏸");
vid.onpause = () => ($("play").textContent = "▶");
vid.ontimeupdate = () => {
  if (!exporting && vid.currentTime >= S.end) { vid.pause(); vid.currentTime = S.start; }
  $("scrub").value = dur ? (vid.currentTime / dur) * 1000 : 0;
  $("tm").textContent = fmt(vid.currentTime);
};
$("scrub").oninput = () => { vid.currentTime = ($("scrub").value / 1000) * dur; };

function pickMime() {
  const list = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  if (!window.MediaRecorder) return null;
  return list.find((m) => MediaRecorder.isTypeSupported(m)) || "";
}

function drawFrame(ctx, cw, ch) {
  ctx.drawImage(vid, 0, 0, cw, ch);
  if (S.b !== 1 || S.c !== 1 || S.s !== 1) {
    const im = ctx.getImageData(0, 0, cw, ch), d = im.data, b = S.b, c = S.c, s = S.s;
    const r0 = 0.213 + 0.787 * s, r1 = 0.715 - 0.715 * s, r2 = 0.072 - 0.072 * s;
    const g0 = 0.213 - 0.213 * s, g1 = 0.715 + 0.285 * s, g2 = 0.072 - 0.072 * s;
    const b0 = 0.213 - 0.213 * s, b1 = 0.715 - 0.715 * s, b2 = 0.072 + 0.928 * s;
    for (let i = 0; i < d.length; i += 4) {
      let r = cl((d[i] / 255) * b), g = cl((d[i + 1] / 255) * b), bl = cl((d[i + 2] / 255) * b);
      r = cl((r - 0.5) * c + 0.5); g = cl((g - 0.5) * c + 0.5); bl = cl((bl - 0.5) * c + 0.5);
      d[i] = cl(r0 * r + r1 * g + r2 * bl) * 255;
      d[i + 1] = cl(g0 * r + g1 * g + g2 * bl) * 255;
      d[i + 2] = cl(b0 * r + b1 * g + b2 * bl) * 255;
    }
    ctx.putImageData(im, 0, 0);
  }
  if (S.text) {
    ctx.font = `700 ${(S.size / 100) * ch}px -apple-system, Helvetica, Arial, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = S.pos === "top" ? "top" : S.pos === "middle" ? "middle" : "bottom";
    const y = S.pos === "top" ? ch * 0.04 : S.pos === "middle" ? ch / 2 : ch * 0.94;
    ctx.lineWidth = Math.max(2, ch * 0.006); ctx.strokeStyle = "#000"; ctx.lineJoin = "round";
    ctx.strokeText(S.text, cw / 2, y, cw * 0.92);
    ctx.fillStyle = S.color;
    ctx.fillText(S.text, cw / 2, y, cw * 0.92);
  }
}

function seek(t) {
  return new Promise((res) => {
    if (Math.abs(vid.currentTime - t) < 0.01) return res();
    const done = () => { vid.removeEventListener("seeked", done); res(); };
    vid.addEventListener("seeked", done);
    vid.currentTime = t;
    setTimeout(done, 1500);
  });
}

$("exp").onclick = async () => {
  if (exporting) return;
  if (!window.MediaRecorder) { $("status").textContent = "Indha browser la export support illa. Latest Safari / Chrome use pannunga."; return; }
  exporting = true; $("exp").disabled = true; $("res").hidden = true; $("barw").hidden = false; $("prog").style.width = "0";
  let wake = null;
  try {
    try { wake = await navigator.wakeLock.request("screen"); } catch {}
    vid.pause();
    ensureAudio();
    if (actx && actx.state !== "running") await actx.resume();
    const sc = Math.min(1, 1280 / Math.max(vid.videoWidth, vid.videoHeight));
    const cw = Math.round((vid.videoWidth * sc) / 2) * 2, ch = Math.round((vid.videoHeight * sc) / 2) * 2;
    const cv = $("cv"); cv.width = cw; cv.height = ch;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    const stream = cv.captureStream(30);
    if (actx) {
      recGain.gain.value = S.mute ? 0 : 1;
      prevGain.gain.value = 0;
      recDest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
    }
    const mime = pickMime();
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 6000000 } : {});
    const chunks = [];
    rec.ondataavailable = (e) => e.data && e.data.size && chunks.push(e.data);
    const stopped = new Promise((r) => (rec.onstop = r));

    await seek(S.start);
    vid.playbackRate = S.speed;
    $("status").textContent = "Export aagudhu... screen on la vechirunga.";
    drawFrame(ctx, cw, ch);
    rec.start(500);
    await vid.play();
    const total = S.end - S.start;
    await new Promise((res) => {
      const loop = () => {
        if (vid.currentTime >= S.end || vid.ended || vid.paused) return res();
        drawFrame(ctx, cw, ch);
        $("prog").style.width = Math.min(100, ((vid.currentTime - S.start) / total) * 100) + "%";
        requestAnimationFrame(loop);
      };
      loop();
    });
    vid.pause();
    rec.stop();
    await stopped;

    const type = rec.mimeType || mime || "video/webm";
    outBlob = new Blob(chunks, { type });
    if (outUrl) URL.revokeObjectURL(outUrl);
    outUrl = URL.createObjectURL(outBlob);
    $("out").src = outUrl;
    $("res").hidden = false;
    $("prog").style.width = "100%";
    $("status").textContent = "Mudinjuduchu! Keezha Save / Share tap pannunga.";
    $("res").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    $("status").textContent = "Export fail: " + e.message;
  } finally {
    exporting = false; $("exp").disabled = false;
    if (prevGain) prevGain.gain.value = S.mute ? 0 : 1;
    if (wake) try { wake.release(); } catch {}
    vid.currentTime = S.start;
  }
};

$("save").onclick = async () => {
  if (!outBlob) return;
  const ext = outBlob.type.includes("mp4") ? "mp4" : "webm";
  const file = new File([outBlob], "mr_busy_edit." + ext, { type: outBlob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch {}
  }
  const a = document.createElement("a");
  a.href = outUrl; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
};
</script>
</body>
</html>
